name: Build OpenWrt AX1800Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Chuẩn bị mã nguồn
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext unzip file libssl-dev wget
          git clone --depth 1 https://github.com/coolsnowwolf/lede.git openwrt
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Thêm danh sách gói theo yêu cầu
        run: |
          cd openwrt
          # Chọn phần cứng JD Cloud AX1800 Pro
          echo "CONFIG_TARGET_qualcommax=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq60xx=y" >> .config
          echo "CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_jdcloud_re-cs-07=y" >> .config

          # Driver chia sẻ mạng từ điện thoại (Android + iPhone)
          echo "CONFIG_PACKAGE_kmod-usb-net-rndis=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-net-ipheth=y" >> .config
          echo "CONFIG_PACKAGE_usbmuxd=y" >> .config

          # Driver & công cụ Modem 4G/5G
          echo "CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-serial-option=y" >> .config
          echo "CONFIG_PACKAGE_modemmanager=y" >> .config
          echo "CONFIG_PACKAGE_atinout=y" >> .config

          # Quản lý 64GB eMMC & Docker
          echo "CONFIG_PACKAGE_parted=y" >> .config
          echo "CONFIG_PACKAGE_resize2fs=y" >> .config
          echo "CONFIG_PACKAGE_dockerd=y" >> .config
          echo "CONFIG_PACKAGE_docker-compose=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-dockerman=y" >> .config

          # Cân bằng tải & DNS
          echo "CONFIG_PACKAGE_mwan3=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-mwan3=y" >> .config
          echo "CONFIG_PACKAGE_dnsmasq-full=y" >> .config

          # Giao diện & Tiếng Việt
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          echo "CONFIG_PACKAGE_luci-i18n-base-vi=y" >> .config

          make defconfig
          make download -j8

      - name: Biên dịch Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Lưu trữ sản phẩm ROM
        uses: actions/upload-artifact@v4
        with:
          name: Firmware-JDCloud-AX1800Pro
          path: openwrt/bin/targets/qualcommax/ipq60xx/*sysupgrade.bin
